[package]
name = "herdr-deckd"
description = "The herdr-deck daemon: watches herdr, renders tiles, and drives Stream Deck frontends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "herdr-deckd"
path = "src/main.rs"

[dependencies]
herdr-deck-herdr.workspace = true
herdr-deck-core.workspace = true
herdr-deck-focus.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
herdr-deck-hid.workspace = true

[dev-dependencies]
herdr-deck-herdr = { workspace = true, features = ["mock"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
