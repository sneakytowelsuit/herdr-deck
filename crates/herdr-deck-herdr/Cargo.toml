[package]
name = "herdr-deck-herdr"
description = "herdr socket client for herdr-deck: wire types, one-shot RPC, and the event subscription"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Exposes the in-process fake herdr server so other crates can test against it without a real
# herdr installation.
mock = ["dep:tempfile"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
# The layout and preset shapes are read from a TOML config before they are written as JSON, so
# their tests here pin both spellings of the same struct.
toml.workspace = true
